<html>
  <head>
    <link rel="stylesheet" href="./Style/app.css" />
    <title>Full Web App Development</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="logoBox">
        <img
          class="hypercity"
          src="./Assets/Icons/logo1.svg"
          alt="hypercity-logo"
        />
        <img class="Clogo" src="./Assets/Icons/logo2.svg" alt="C-logo" />
      </div>

      <search class="searchBar">
        <input class="searchInput" type="search" placeholder="Search" />
        <button type="submit">
          <img
            src="./Assets/Icons/searchIcon.svg"
            width="24px"
            alt="search-icon"
          />
        </button>
      </search>

      <ul class="navSection">
        <li class="loginBox">
          <img
            src="./Assets/Icons/profile.svg"
            width="24px"
            alt="profile-icon"
          />
          <p>Login</p>
        </li>
        <li style="width: 2px; height: 20px; background: gray" />
        <li class="cartBox">
          <img
            src="./Assets/Icons/shopping-cart.svg"
            width="24px"
            alt="cart-icon"
          />
          <p>Cart (0)</p>
        </li>
      </ul>
    </nav>
  </body>
</html>
