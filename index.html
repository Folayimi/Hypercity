<html>
  <head>
    <link rel="stylesheet" href="./Style/app.css" />
    <title>Full Web App Development</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="logoBox">
        <img
          class="hypercity"
          src="./Assets/Icons/logo1.svg"
          alt="hypercity-logo"
        />
        <img class="Clogo" src="./Assets/Icons/logo2.svg" alt="C-logo" />
      </div>

      <search class="searchBar">
        <input class="searchInput" type="search" placeholder="Search" />
        <button type="submit">
          <img
            src="./Assets/Icons/searchIcon.svg"
            width="24px"
            alt="search-icon"
          />
        </button>
      </search>

      <ul class="navSection">
        <li class="loginBox">
          <img
            src="./Assets/Icons/profile.svg"
            width="24px"
            alt="profile-icon"
          />
          <p>Login</p>
        </li>
        <li style="width: 1px; height: 20px; background: gray" />
        <li class="cartBox">
          <img
            src="./Assets/Icons/shopping-cart.svg"
            width="24px"
            alt="cart-icon"
          />
          <p>Cart (0)</p>
        </li>
      </ul>
    </nav>

    <section class="hero-section">

      <div class="category-layout">
        <div class="category-title">
          <img
            src="./Assets/Icons/menu.svg"
            width="24px"
            style="cursor: pointer"
            alt="menu-icon"
          />
          <p>Shop by Category</p>
        </div>

        <div class="category-contents" id="categoryBox">

        </div>
      </div>

      <div class="hero-feed">
        <img src="./Assets/Images/hero-banner.svg" alt="hero-feed-banner" />
        <div class="hero-info">
          <div class="info-box">
            <img src="./Assets/Icons/delivery-icon.svg" />
            <div>
              <p style="font-weight: bold; margin-bottom: 3px">Home Delivery</p>
              <p style="color: #546881">Free Shipping On All Order</p>
            </div>
          </div>

          <div style="width: 1px; height: 25px; background: #b2bbc6"></div>

          <div class="info-box">
            <img src="./Assets/Icons/call.svg" />
            <div>
              <p style="font-weight: bold; margin-bottom: 3px">
                Online Support
              </p>
              <p style="color: #546881">Technical online support 24/7</p>
            </div>
          </div>

          <div style="width: 1px; height: 25px; background: #b2bbc6"></div>

          <div class="info-box">
            <img src="./Assets/Icons/wallet-card.svg" />
            <div>
              <p style="font-weight: bold; margin-bottom: 3px">Low Price</p>
              <p style="color: #546881">Enjoy low price every weekend</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
  <script src="./Controller/categorySection.js"></script>
</html>
